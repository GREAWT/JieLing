<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="洁灵 · AI 磁盘清理决策助手。先判断文件夹归属与删除后果，再移入可一键还原的隔离区，而不是直接删除。内置 100 条文件夹指纹规则、云端 AI 判定未知目录，并为删不掉的顽固软件提供复活诊断、官方卸载路径与逐项可选的清理脚本。"
    />
    <meta name="theme-color" content="#05080f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305080f'/%3E%3Cpath d='M16 5l9 4v7c0 6-4 9.5-9 11-5-1.5-9-5-9-11V9z' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Cpath d='M11 16l3.5 3.5L21 13' fill='none' stroke='%2334d399' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>洁灵 · AI 磁盘清理决策助手</title>
    <script>
      // 首帧前定主题，避免深空控制台闪成白底。默认深空档，用户可切换。
      (function () {
        var el = document.documentElement;
        var dark = true;
        try {
          var saved = localStorage.getItem("dareclean.theme");
          if (saved === "light" || saved === "dark") dark = saved === "dark";
        } catch (err) {
          dark = true;
        }
        el.classList.toggle("dark", dark);
        el.dataset.theme = dark ? "dark" : "light";
        el.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
